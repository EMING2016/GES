<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f1f3f9; --border:#e5e7eb;
    --text:#0f172a; --text-muted:#64748b; --primary:#1e40af; --primary-2:#2563eb;
    --accent:#0ea5e9; --success:#16a34a; --warn:#f59e0b; --danger:#dc2626;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
    --radius:14px; --radius-sm:10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0b1220; --surface:#111a2e; --surface-2:#0f172a; --border:#1f2a44;
    --text:#e5e7eb; --text-muted:#94a3b8; --primary:#3b82f6; --primary-2:#60a5fa;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh}
  a{color:var(--primary-2);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}

  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;min-height:100dvh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .brand-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:white;font-weight:800;font-size:22px}
  .brand-name{font-weight:700;font-size:15px;line-height:1.1}
  .brand-sub{font-size:11px;color:var(--text-muted)}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;text-align:left;width:100%}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:linear-gradient(90deg, rgba(30,64,175,.12), transparent);color:var(--primary);font-weight:600}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:14px 12px 6px}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .search{flex:1;max-width:480px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;color:var(--text);outline:none}
  .search input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text);position:relative}
  .icon-btn:hover{background:var(--surface-2)}
  .badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--surface)}
  .user-chip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);color:white;display:grid;place-items:center;font-weight:700;font-size:13px}
  .user-name{font-size:13px;font-weight:600;line-height:1.1}
  .user-role{font-size:11px;color:var(--text-muted)}

  .content{padding:20px;max-width:1400px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .page-title{font-size:22px;font-weight:700;margin:0}
  .page-sub{color:var(--text-muted);font-size:13px;margin-top:2px}

  .grid{display:grid;gap:14px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .stat{display:flex;flex-direction:column;gap:6px}
  .stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .stat-value{font-size:24px;font-weight:700}
  .stat-delta{font-size:12px;color:var(--success);font-weight:600}
  .stat-delta.down{color:var(--danger)}
  .stat-icon{width:38px;height:38px;border-radius:10px;background:rgba(37,99,235,.12);color:var(--primary);display:grid;place-items:center}
  .stat-row{display:flex;align-items:center;justify-content:space-between}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14px}
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--primary);color:white;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-2)}
  .btn-danger{background:var(--danger);color:white;border-color:var(--danger)}
  .btn-ghost{background:transparent;border-color:transparent}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn svg{width:16px;height:16px}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--surface-2);font-weight:600;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--surface-2)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.green{background:rgba(22,163,74,.12);color:var(--success)}
  .pill.red{background:rgba(220,38,38,.12);color:var(--danger)}
  .pill.amber{background:rgba(245,158,11,.14);color:var(--warn)}
  .pill.blue{background:rgba(37,99,235,.12);color:var(--primary)}
  .pill.gray{background:var(--surface-2);color:var(--text-muted)}

  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .field.full{grid-column:1/-1}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
  .tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-muted);border:none;background:transparent;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(4px)}
  .modal-backdrop.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-head h3{margin:0;font-size:17px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}

  .toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:340px}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;animation:slide .3s ease}
  .toast.success{border-left-color:var(--success)}
  .toast.error{border-left-color:var(--danger)}
  .toast.warn{border-left-color:var(--warn)}
  @keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  .bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr)}
  .bnav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:transparent;color:var(--text-muted);font-size:10px;font-weight:600}
  .bnav.active{color:var(--primary)}
  .bnav svg{width:22px;height:22px}

  .login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1e3a8a 0%,#0ea5e9 100%)}
  .login-card{background:var(--surface);border-radius:18px;padding:32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-card h1{margin:0 0 4px;font-size:22px}
  .login-card p{margin:0 0 20px;color:var(--text-muted);font-size:14px}
  .login-hint{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-muted);margin-top:16px;line-height:1.5}

  .receipt{background:white;color:#0f172a;padding:28px;border-radius:12px;font-family:Georgia,serif}
  .receipt-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1e40af;padding-bottom:14px;margin-bottom:14px}
  .receipt-school{font-size:20px;font-weight:700;color:#1e40af}
  .receipt-meta{text-align:right;font-size:12px;color:#475569}
  .receipt h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#475569}
  .receipt-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:14px}
  .receipt-total{display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid #1e40af;font-size:18px;font-weight:700;margin-top:8px}
  .receipt-foot{margin-top:30px;display:flex;justify-content:space-between;font-size:12px;color:#475569}

  .chart{width:100%;height:220px}

  @media (max-width: 960px){
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .grid-3{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
  }
  @media (max-width: 760px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .bottom-nav{display:block}
    body{padding-bottom:72px}
    .content{padding:14px}
    .topbar{padding:10px 14px}
    .user-chip .user-name,.user-chip .user-role{display:none}
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
    .page-title{font-size:18px}
    th,td{padding:10px;font-size:13px}
  }
  @media print{
    .sidebar,.topbar,.bottom-nav,.no-print{display:none !important}
    .app{grid-template-columns:1fr}
    .content{padding:0}
    .card{box-shadow:none;border:1px solid #ccc}
  }
</style>
</head>

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const fresh = defaultDB();
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function resetDB(){ DB = defaultDB(); saveDB(); render(); }

const fmtDateTime = d => { if(!d) return '—'; const x=new Date(d); return x.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(100%)'; el.style.transition='.3s'; }, 2800);
  setTimeout(()=>el.remove(), 3200);
}

let currentUser = JSON.parse(sessionStorage.getItem('gf_user')||'null');
function login(username, password){
  const u = DB.users.find(x=>x.username===username && x.password===password);
  if(!u) return false;
  currentUser = u;
  sessionStorage.setItem('gf_user', JSON.stringify(u));
  return true;
}
function logout(){ currentUser=null; sessionStorage.removeItem('gf_user'); render(); }
function can(roleList){ return roleList.includes(currentUser.role); }

function studentTotalFees(studentId){
  const s = byId(DB.students, studentId);
  if(!s) return 0;
  return DB.fees.filter(f=>f.classId===s.classId && f.session===s.session && f.term===DB.settings.currentTerm)
    .reduce((a,f)=>a+f.amount,0);
}
function studentPaid(studentId){
  return DB.payments.filter(p=>p.studentId===studentId && p.status==='Successful').reduce((a,p)=>a+p.amount,0);
}
function studentBalance(studentId){ return Math.max(0, studentTotalFees(studentId)-studentPaid(studentId)); }
function nextReceiptRef(){
  const n = DB.payments.length + 1;
  return `${DB.settings.receiptPrefix}-<LaTex>id_6</LaTex>{String(n).padStart(6,'0')}`;
}
function addAudit(action, details){
  DB.auditLogs.unshift({id:uid('a'),action,actor:currentUser?.name||'System',details,time:new Date().toISOString()});
  if(DB.auditLogs.length>500) DB.auditLogs.length=500;
}
function addNotification(text, userId='u1'){
  DB.notifications.unshift({id:uid('n'),text,time:new Date().toISOString(),read:false,userId});
}

function renderPage(){

  if(currentUser.role==='parent'){
    if(!['dashboard','payments','notifications','student'].includes(state.route)) state.route='dashboard';
  }
  if(currentUser.role==='teacher'){
    if(!['dashboard','students','student','notifications'].includes(state.route)) state.route='dashboard';
  }
  const pages = {
    dashboard: renderDashboard,
    students: renderStudents,
    student: renderStudentProfile,
    payments: renderPayments,
    items: renderItems,
    inventory: renderInventory,
    classes: renderClasses,
    reports: renderReports,
    audit: renderAudit,
    settings: renderSettings,
    notifications: renderNotifications,
  };
  (pages[state.route] || renderDashboard)(pc);
}

  const totalPaid = DB.payments.filter(p=>p.status==='Successful').reduce((a,p)=>a+p.amount,0);
  const outstanding = totalExpected - totalPaid;
  const today = new Date().toISOString().slice(0,10);
  const paidToday = DB.payments.filter(p=>p.status==='Successful' && p.date===today).reduce((a,p)=>a+p.amount,0);
  const itemsDistributed = DB.distributions.reduce((a,d)=>a+d.quantity,0);

  const recentPayments = [...DB.payments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const recentActivities = [...DB.auditLogs].slice(0,6);

  const months = [];
  for(let i=5;i>=0;i--){

  root.innerHTML = `

    <div class="grid grid-2" style="margin-bottom:16px">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0;font-size:15px">Tuition Collected (Last 6 Months)</h3>

            <tr><td>${s?s.firstName+' '+s.lastName:'—'}</td><td><strong>${fmt(p.amount)}</strong></td><td>${fmtDate(p.date)}</td><td><span class="pill blue">${p.method}</span></td></tr>`;}).join('')}

function statCard(label, value, sub, icon, color){
  const bg = color==='green'?'rgba(22,163,74,.12)':color==='red'?'rgba(220,38,38,.12)':'rgba(37,99,235,.12)';
  const fg = color==='green'?'var(--success)':color==='red'?'var(--danger)':'var(--primary)';
  return `<div class="card stat">
    <div class="stat-row">
      <div>
        <div class="stat-label"><LaTex>id_33</LaTex>{value}</div>
        <div class="stat-delta <LaTex>id_34</LaTex>{sub}</div>
      </div>
      <div class="stat-icon" style="background:<LaTex>id_35</LaTex>{fg}"><LaTex>id_36</LaTex>{data.map((d,i)=>{
      const w = 500/data.length;
      const h = (d.value/max)*160;
      const x = i*w + w*0.15;
      const bw = w*0.7;
      const y = 180-h;
      return `
        <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="url(#grad)" />
        <text x="${x+bw/2}" y="${y-6}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${fmtFn(d.value)}</text>
        <text x="${x+bw/2}" y="200" font-size="11" fill="var(--text-muted)" text-anchor="middle">${d.label}</text>
      `;
    }).join('')}
    <defs>
      <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#2563eb"/>
        <stop offset="100%" stop-color="#0ea5e9"/>
      </linearGradient>
    </defs>
  </svg>`;
}
